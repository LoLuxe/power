<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Router Monitor</title>
<style>
  *, *::before, *::after { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
  }

  :root {
    --bg-main:      #000000;
    --bg-card:      #0a0a0a;
    --bg-element:   #121212;
    --bg-hover:     #1a1a1a;
    
    --border-light: #222222;
    --border-dim:   #181818;
    
    --text-primary: #ffffff;
    --text-sec:     #a1a1aa;
    --text-muted:   #52525b;
    
    --indicator-on:  #ffffff;
    --indicator-off: #3f3f46;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
  }

  /* ── header ── */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 32px;
  }
  
  .header-left { 
    display: flex; 
    align-items: center; 
    gap: 16px; 
  }

  .icon-wrapper {
    width: 44px; 
    height: 44px;
    background: var(--bg-element);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    display: flex; 
    align-items: center; 
    justify-content: center;
    color: var(--text-primary);
  }

  .header-title { 
    font-size: 16px; 
    font-weight: 500; 
    letter-spacing: -0.01em;
  }

  .header-sub { 
    font-size: 13px; 
    color: var(--text-sec); 
    margin-top: 4px; 
  }

  /* ── status badge ── */
  .badge {
    display: flex; 
    align-items: center; 
    gap: 8px;
    padding: 6px 12px;
    background: var(--bg-element);
    border: 1px solid var(--border-dim);
    border-radius: 6px;
    font-size: 12px; 
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: all 0.3s ease;
  }

  .badge.online { color: var(--text-primary); border-color: var(--border-light); }
  .badge.offline { color: var(--text-sec); }
  .badge.loading { color: var(--text-muted); }

  .dot {
    width: 6px; 
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  
  .badge.online .dot { background: var(--indicator-on); box-shadow: 0 0 8px rgba(255,255,255,0.4); }
  .badge.offline .dot { background: var(--indicator-off); }
  .badge.loading .dot { background: var(--text-muted); }

  .pulse {
    animation: pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }

  /* ── big metric ── */
  .metric-section {
    padding: 0 0 32px 0;
    border-bottom: 1px solid var(--border-light);
    margin-bottom: 24px;
  }

  .metric-label { 
    font-size: 12px; 
    color: var(--text-sec); 
    font-weight: 500;
    margin-bottom: 12px; 
  }

  .metric-value { 
    font-size: 48px; 
    font-weight: 300; 
    letter-spacing: -0.03em; 
    font-variant-numeric: tabular-nums; 
    line-height: 1;
  }

  .metric-unit { 
    font-size: 18px; 
    color: var(--text-sec); 
    font-weight: 400;
    margin-left: 4px; 
  }

  .metric-alert {
    color: var(--text-primary);
    text-decoration: underline;
    text-decoration-color: var(--text-muted);
    text-underline-offset: 6px;
  }

  /* ── history ── */
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .section-label {
    font-size: 13px; 
    font-weight: 500;
    color: var(--text-primary);
  }

  .history-list { 
    display: flex; 
    flex-direction: column; 
    gap: 8px; 
  }

  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-element);
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 12px 16px;
    transition: border-color 0.2s;
  }
  
  .history-item:hover {
    border-color: var(--border-light);
  }

  .history-item-left { 
    display: flex; 
    align-items: center; 
    gap: 12px; 
  }

  .h-dot { 
    width: 6px; 
    height: 6px; 
    border-radius: 50%; 
    background: var(--text-muted); 
    flex-shrink: 0; 
  }

  .h-time { 
    font-size: 14px; 
    color: var(--text-primary); 
    font-variant-numeric: tabular-nums; 
  }

  .h-ago { 
    font-size: 13px; 
    color: var(--text-sec); 
  }

  /* ── footer ── */
  .footer {
    margin-top: 32px;
    display: flex; 
    align-items: center; 
    justify-content: space-between;
  }

  .footer-note { 
    font-size: 12px; 
    color: var(--text-muted); 
    font-variant-numeric: tabular-nums;
  }

  .refresh-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px; 
    font-weight: 500;
    color: var(--text-primary);
    background: var(--bg-element); 
    border: 1px solid var(--border-dim); 
    cursor: pointer;
    padding: 8px 14px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .refresh-btn:hover:not(:disabled) { 
    background: var(--bg-hover);
    border-color: var(--border-light);
  }

  .refresh-btn:disabled {
    color: var(--text-muted);
    cursor: not-allowed;
  }

  .spin-icon { 
    width: 14px; 
    height: 14px;
  }

  .spin { 
    animation: spin 1s linear infinite; 
  }

  @keyframes spin { 
    to { transform: rotate(360deg); } 
  }

  /* ── skeleton ── */
  .skeleton {
    background: linear-gradient(90deg, var(--bg-element) 25%, var(--bg-hover) 50%, var(--bg-element) 75%);
    background-size: 200% 100%;
    animation: shimmer 2s infinite linear;
    border-radius: 8px;
  }

  @keyframes shimmer { 
    to { background-position: -200% 0; } 
  }

  .no-data { 
    text-align: center; 
    padding: 32px 0; 
    color: var(--text-muted); 
    font-size: 13px; 
  }
</style>
</head>
<body>
<main class="card" role="main" aria-label="Панель мониторинга">

  <div class="header">
    <div class="header-left">
      <div class="icon-wrapper" aria-hidden="true">
        <!-- SVG Иконка сервера/роутера -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
          <line x1="6" y1="18" x2="6.01" y2="18"></line>
          <line x1="10" y1="18" x2="10.01" y2="18"></line>
          <path d="M12 14v-4"></path>
          <path d="M8 6h8"></path>
          <path d="M10 2h4"></path>
        </svg>
      </div>
      <div>
        <h1 class="header-title">Router Status</h1>
        <div class="header-sub" id="updated">Инициализация...</div>
      </div>
    </div>
    <div class="badge loading" id="badge">
      <span class="dot"></span>
      <span id="badge-text">Сигнал</span>
    </div>
  </div>

  <div class="metric-section">
    <div class="metric-label">Время с последнего отклика</div>
    <div>
      <span class="metric-value" id="silence">—</span><span class="metric-unit" id="silence-unit"></span>
    </div>
  </div>

  <div class="section-header">
    <div class="section-label">Журнал сигналов</div>
  </div>
  
  <div class="history-list" id="history">
    <div class="history-item skeleton" style="height:46px; border:none;"></div>
    <div class="history-item skeleton" style="height:46px; border:none;"></div>
    <div class="history-item skeleton" style="height:46px; border:none;"></div>
  </div>

  <div class="footer">
    <span class="footer-note" id="next-refresh">Обновление: 30с</span>
    <button class="refresh-btn" id="refresh-btn" onclick="load()" aria-label="Обновить">
      <svg class="spin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"></path>
        <path d="M3 12a9 9 0 1 0 2.13-5.88L21 8"></path>
      </svg>
      Обновить
    </button>
  </div>
</main>

<script>
const STATUS_URL = '/api/status';

function formatSilence(seconds) {
  if (seconds < 60) return [seconds, 'с'];
  if (seconds < 3600) return [Math.round(seconds / 60), 'мин'];
  return [(seconds / 3600).toFixed(1), 'ч'];
}

function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function formatDate(iso) {
  const d = new Date(iso);
  const today = new Date();
  const isToday = d.toDateString() === today.toDateString();
  if (isToday) return formatTime(iso);
  return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) + ' · ' + formatTime(iso);
}

function timeAgo(ts) {
  const sec = Math.round((Date.now() - ts) / 1000);
  if (sec < 60) return `${sec}с назад`;
  if (sec < 3600) return `${Math.round(sec/60)}м назад`;
  return `${Math.round(sec/3600)}ч назад`;
}

async function load() {
  const btn = document.getElementById('refresh-btn');
  const icon = btn.querySelector('.spin-icon');
  
  if (icon) icon.classList.add('spin');
  btn.disabled = true;

  try {
    const res = await fetch(STATUS_URL + '?_=' + Date.now());
    const data = await res.json();
    render(data);
  } catch(e) {
    document.getElementById('updated').textContent = 'Ошибка соединения';
  } finally {
    if (icon) icon.classList.remove('spin');
    btn.disabled = false;
  }
}

function render(data) {
  const badge = document.getElementById('badge');
  const badgeText = document.getElementById('badge-text');
  const silenceEl = document.getElementById('silence');
  const silenceUnit = document.getElementById('silence-unit');
  const historyEl = document.getElementById('history');
  const updatedEl = document.getElementById('updated');

  updatedEl.textContent = 'Обновлено: ' + new Date().toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });

  if (data.status === 'no_data') {
    badge.className = 'badge loading';
    badge.querySelector('.dot').className = 'dot';
    badgeText.textContent = 'Нет данных';
    silenceEl.textContent = '—';
    silenceUnit.textContent = '';
    historyEl.innerHTML = '<div class="no-data">Сигналы отсутствуют</div>';
    return;
  }

  const online = data.status === 'ONLINE';
  badge.className = 'badge ' + (online ? 'online' : 'offline');
  badge.querySelector('.dot').className = 'dot' + (online ? ' pulse' : '');
  badgeText.textContent = online ? 'Online' : 'Offline';

  const [val, unit] = formatSilence(data.silence_seconds);
  silenceEl.textContent = val;
  silenceUnit.textContent = unit;

  // Если простой более 3 минут — добавляем подчеркивание как "alert" вместо красного цвета
  if (data.silence_seconds > 180) {
    silenceEl.classList.add('metric-alert');
  } else {
    silenceEl.classList.remove('metric-alert');
  }

  const history = data.history || [];
  if (!history.length) {
    historyEl.innerHTML = '<div class="no-data">Журнал пуст</div>';
    return;
  }

  historyEl.innerHTML = history.map((ts, i) => {
    const iso = new Date(ts).toISOString();
    // Делаем точку первого (самого свежего) элемента ярче, остальные тусклые
    const dotColor = i === 0 ? 'var(--text-primary)' : 'var(--text-muted)';
    return `
      <div class="history-item">
        <div class="history-item-left">
          <span class="h-dot" style="background: ${dotColor}"></span>
          <span class="h-time">${formatDate(iso)}</span>
        </div>
        <span class="h-ago">${timeAgo(ts)}</span>
      </div>`;
  }).join('');
}

let countdown = 30;
function tick() {
  countdown--;
  document.getElementById('next-refresh').textContent = `Обновление: ${countdown}с`;
  if (countdown <= 0) { 
    countdown = 30; 
    load(); 
  }
}

// Заглушка для демонстрации верстки при локальном открытии файла
// Удалите или закомментируйте эту часть при деплое, чтобы fetch работал с вашим API
window.fetch = async () => ({
  json: async () => ({
    status: "ONLINE",
    silence_seconds: 45,
    history: [Date.now() - 45000, Date.now() - 120000, Date.now() - 3600000]
  })
});

load();
setInterval(tick, 1000);
</script>
</body>
</html>
